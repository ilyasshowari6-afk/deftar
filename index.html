  const data={email:String(fields.get('email')||'').trim(),password:String(fields.get('password')||''),captchaToken:captchaToken()};
  if(mode!=='update')auth.email=data.email;
  authNotice='';error='';
  if(captchaEnabled&&mode!=='update'&&!data.captchaToken){
    $('#captcha-note').textContent=t('captchaFailed');
    return;
  }
  busy=true;render();
  try{
    if(mode==='login'){user=await api('auth','POST',data);await load();}
    if(mode==='signup'){
      const result=await api('auth/signup','POST',data);
      if(result.session){await api('logout','POST');throw {error:'configuration'};}
      authNotice='signupSent';
    }
    if(mode==='recover'){await api('auth/recover','POST',data);authNotice='emailSent';}
    if(mode==='update'){
      await api('auth/update-password','POST',data);
      rememberRecovery(false);authMode='login';authNotice='passwordUpdated';
    }
  }catch(e){error=e.error||'serverError'}
  finally{busy=false;render()}
}
async function initializeAuth(){
  const url=new URL(location.href);
  const code=url.searchParams.get('code');
  const failed=url.searchParams.has('error')||url.searchParams.has('error_code')||url.hash.includes('error=');
  if(code||failed){
    for(const key of ['code','error','error_code','error_description'])url.searchParams.delete(key);
    url.hash='';
    history.replaceState(null,'',url);
  }
  if(failed){error='invalidLink';return;}
  if(code){
    let result;
    try{result=await api('auth/callback','POST',{code});}
    catch{error='invalidLink';return;}
    if(result.redirectType==='recovery'){
      rememberRecovery(true);authMode='update';return;
    }
    rememberRecovery(false);
  }
  const state=await api('me');
  if(state.user&&recoveryPending()){authMode='update';return;}
  if(!state.user)rememberRecovery(false);
  user=state.user;
  if(user)await load();
}
function inPeriod(d){if(filter==='all')return true;if(filter==='range')return d>=filterDate&&d<=filterEnd;return d.slice(0,filter==='year'?4:filter==='month'?7:10)===filterDate.slice(0,filter==='year'?4:filter==='month'?7:10);}
function dashboard(){const list=clients.filter(c=>(!query||matches(c,query))&&(filter==='all'||c.entries.some(e=>inPeriod(e.date))));const entries=clients.flatMap(c=>c.entries);return `<section class="intro"><div><div class="eyebrow">${t('hello')}</div><h1>${t('heading')}</h1><p>${t('intro')}</p></div><button class="primary add-main" data-action="add">＋ ${t('add')}</button></section><section class="stats"><div><span>${t('total')}</span><strong>${clients.length}<i>♙</i></strong></div><div><span>${t('records')}</span><strong>${entries.length}<i>▤</i></strong></div><div><span>${t('latest')}</span><strong class="date-stat">${dateText(entries.map(e=>e.date).sort().at(-1))}<i>▦</i></strong></div></section><section class="toolbar"><div class="search-box"><span>⌕</span><input type="search" id="search" placeholder="${t('search')}" aria-label="${t('search')}" value="${esc(query)}">${query?`<button data-action="clear-search" aria-label="${t('clear')}">×</button>`:''}</div><div class="filter-row"><label class="filter-label">▦ ${t('period')}<select id="filter">${['all','day','month','year','range'].map(k=>`<option value="${k}" ${filter===k?'selected':''}>${t(k)}</option>`).join('')}</select></label>${filter!=='all'?`${filter==='range'?`<span>${t('from')}</span>`:''}${dateSelect(filterDate,'filter',filter==='month'?'month':filter==='year'?'year':'day')}${filter==='range'?`<span>${t('to')}</span>${dateSelect(filterEnd,'filterEnd')}`:''}<button class="text-button" data-action="clear-filter">${t('clear')}</button>`:''}</div>${filter!=='all'?`<p class="filter-help">${t('filterHint')}</p>`:''}${filter==='range'&&filterDate>filterEnd?`<p class="error" role="alert">${t('dateInvalid')}</p>`:''}</section><div class="list-heading"><h2>${t('allClients')} <span>${list.length}</span></h2><span>${yearSpan()}</span></div>${list.length?`<section class="cards">${list.map(c=>`<button class="client-card" data-client="${c.id}"><div class="card-top"><span class="client-avatar">${esc(c.first[0]+c.last[0])}</span><span class="card-arrow">${icon('arrow')}</span></div><h3>${esc(c.first+' '+c.last)}</h3><p class="phone" dir="ltr">${esc(c.phone||'—')}</p><div class="card-meta"><span>${t('latest')}<b>${dateText(c.entries[0]?.date)}</b></span><span class="badge">${c.entries.length} ${t('entries')}</span></div></button>`).join('')}</section>`:`<section class="empty"><div>▤</div><h2>${t(query||filter!=='all'?'noResults':'empty')}</h2><p>${t(query||filter!=='all'?'noResultsHint':'emptyHint')}</p>${!query&&filter==='all'?`<button class="primary" data-action="add">＋ ${t('add')}</button>`:''}</section>`}`;}
function detail(){const c=clients.find(x=>x.id===active);if(!c){active=null;return dashboard();}return `<button class="text-button back" data-action="home">${lang==='ar'?'→':'←'} ${t('return')}</button><section class="profile-header"><span class="client-avatar large">${esc(c.first[0]+c.last[0])}</span><div><div class="eyebrow">${t('clientCard')}</div><h1>${esc(c.first+' '+c.last)}</h1><p dir="ltr" class="profile-phone">${esc(c.phone||'—')}</p></div><button class="secondary" data-action="edit-client">✎ ${t('editClient')}</button></section><section class="profile-grid"><div><div class="notes-panel"><span class="eyebrow">${t('notes')}</span><p>${esc(c.notes||t('noNotes'))}</p></div><div class="history-heading"><div><h2>${t('history')}</h2><small>${t('fullHistory')}</small></div><button class="primary" data-action="add-existing">＋ ${t('add')}</button></div><div class="timeline">${c.entries.map(e=>`<article class="entry"><div class="entry-dot"></div><div><strong>${dateText(e.date)}</strong><p>${esc(e.notes||t('noNotes'))}</p></div><button class="text-button" data-entry="${e.id}">✎ ${t('edit')}</button></article>`).join('')}</div></div><div class="profile-summary"><span>${t('records')}</span><strong>${c.entries.length}</strong><hr><span>${t('latest')}</span><h3>${dateText(c.entries[0]?.date)}</h3><div class="secure-note">◈ ${t('private')}</div>${button('deleteClient','text-button','data-action="delete-client"')}</div></section>`;}
function startAdd(c=null){modal='add';draft={first:c?.first||'',last:c?.last||'',phone:c?.phone||'',notes:c?.notes||'',date:today,entryNotes:'',clientId:c?.id||'',newClient:false};error='';duplicate=null;suggest=!c;render();setTimeout(()=>$('#first')?.focus(),0);}
function calendarHTML(){const [y,m,d]=calendarDate.split('-').map(Number),n=new Date(Date.UTC(y,m,0)).getUTCDate(),offset=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;return `${dateSelect(calendarDate,'calendar')}<div class="calendar-grid">${T[lang].days.map(x=>`<span>${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:n},(_,i)=>{const date=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;const count=clients.flatMap(c=>c.entries).filter(e=>e.date===date).length;return `<button type="button" class="${d===i+1?'chosen':''} ${count?'has-record':''}" data-cal-day="${date}" aria-label="${dateText(date)}${count?' · '+count+' '+t('entries'):''}">${i+1}${count?'<i></i>':''}</button>`}).join('')}</div><button class="primary full" data-action="apply-calendar">${t('day')} · ${dateText(calendarDate)}</button>`;}
function modalPage(){
if(modal==='migration')return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title">${t('migration')}</h2>${button('close','text-button','data-action="close"')}</div><div class="modal-actions">${button('exportLocal','secondary','data-action="export-local"')}${button('importHere','primary','data-action="import-local"')}</div><label>${t('importFile')}<input type="file" id="legacy-file" accept=".json,application/json" ${busy?'disabled':''}></label>${error?`<p class="error" role="alert">${t(error)}</p>`:''}${importResult?`<p role="status">${esc(importResult)}</p>`:''}</section></div>`;
if(modal==='calendar')return `<div class="overlay"><section class="modal calendar-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title">${t('calendar')}</h2><button class="icon-btn" data-action="close" aria-label="${t('close')}">×</button></div><p class="muted">${yearSpan()}</p>${calendarHTML()}</section></div>`;
const selected=clients.find(c=>c.id===draft.clientId),isEdit=modal==='client',isEntry=modal==='entry';let suggestions=[];if(modal==='add'&&!selected&&!draft.newClient&&suggest&&(norm(draft.first).length>=2||norm(draft.last).length>=2)){suggestions=clients.filter(c=>(norm(draft.first).length>=2&&matches(c,draft.first))||(norm(draft.last).length>=2&&matches(c,draft.last))).slice(0,8);}
return `<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-heading"><div><div class="eyebrow">${t('brand')}</div><h2 id="modal-title">${t(isEdit?'editClient':isEntry?'editEntry':'add')}</h2></div><button class="icon-btn" data-action="close" aria-label="${t('close')}">×</button></div><form id="entry-form" novalidate>${!isEntry?`<div class="form-grid">${input('first',draft.first,`${selected&&!isEdit?'readonly':''} maxlength="100" required autocomplete="off"`)}${input('last',draft.last,`${selected&&!isEdit?'readonly':''} maxlength="100" required autocomplete="off"`)}</div>${modal==='add'?`<small class="hint">${t(selected?'selected':'selectHint')}</small>${selected?`<div class="selected-client">✓ ${esc(selected.first+' '+selected.last)} <span dir="ltr">${esc(selected.phone)}</span><button type="button" class="text-button" data-action="unselect">${t('cancel')}</button></div>`:''}${suggestions.length?`<div class="suggestions" aria-label="${t('existing')}">${suggestions.map(c=>`<button type="button" data-select="${c.id}"><b>${esc(c.first+' '+c.last)}</b><span dir="ltr">${esc(c.phone||'—')}</span></button>`).join('')}</div>`:''}${!selected&&!draft.newClient?`<button type="button" class="new-client" data-action="new-client">＋ ${t('newClient')}</button>`:''}${draft.newClient?`<div class="new-label">＋ ${t('newClient')}</div>`:''}`:''}${input('phone',draft.phone,`type="tel" dir="ltr" maxlength="40" ${selected&&!isEdit?'readonly':''}`)}${textarea('notes',draft.notes).replace('<textarea',`<textarea ${selected&&!isEdit?'readonly':''}`)}`:''}${!isEdit?`<div class="entry-form-block"><label>${t('date')}</label>${dateSelect(draft.date,'draft')}<small class="hint">${yearSpan()}</small>${textarea('entryNotes',draft.entryNotes)}</div>`:''}${duplicate?`<div class="error" role="alert">${t('duplicatePhone')}<button type="button" class="text-button" data-select="${duplicate.id}">${t('viewExisting')} · ${esc(duplicate.first+' '+duplicate.last)}</button></div>`:''}${error?`<p class="error" role="alert">${t(error)}</p>`:''}<div class="modal-actions"><button type="button" class="secondary" data-action="close">${t('cancel')}</button><button class="primary" ${busy||(!isEdit&&!isEntry&&!selected&&!draft.newClient)?'disabled':''}>${t(busy?'loading':isEdit?'saveClient':'save')}</button></div></form></section></div>`;}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{active=b.dataset.client;render();window.scrollTo(0,0)});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{const c=clients.find(x=>x.id===b.dataset.select)||duplicate;if(!c)return;if(modal==='client'){active=c.id;modal=null;duplicate=null;render();return;}modal='add';draft={...draft,clientId:c.id,first:c.first,last:c.last,phone:c.phone,notes:c.notes,newClient:false};error='';duplicate=null;suggest=false;render()});
$('#search')?.addEventListener('input',e=>{query=e.target.value;render()});$('#filter')?.addEventListener('change',e=>{filter=e.target.value;render()});
for(const k of ['first','last','phone','notes','entryNotes'])$('#'+k)?.addEventListener('input',e=>{draft[k]=e.target.value;error='';duplicate=null;if(['first','last'].includes(k)&&!draft.newClient){suggest=true;render();}else if(k==='phone'){const found=draft.phone&&clients.find(c=>c.id!==draft.clientId&&phoneNorm(c.phone)===phoneNorm(draft.phone));if(found)duplicate=found;render()}});
$('#email')?.addEventListener('input',e=>{auth.email=e.target.value});
document.querySelectorAll('[data-date] select').forEach(select=>select.onchange=()=>{const wrap=select.closest('[data-date]');let y=Number(wrap.querySelector('[data-part=y]').value),m=Number(wrap.querySelector('[data-part=m]')?.value||1),d=Number(wrap.querySelector('[data-part=d]')?.value||1);d=Math.min(d,new Date(Date.UTC(y,m,0)).getUTCDate());const v=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;if(wrap.dataset.date==='draft')draft.date=v;else if(wrap.dataset.date==='filter')filterDate=v;else if(wrap.dataset.date==='filterEnd')filterEnd=v;else calendarDate=v;render()});
document.querySelectorAll('[data-cal-day]').forEach(b=>b.onclick=()=>{calendarDate=b.dataset.calDay;render()});document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{const c=clients.find(c=>c.id===active),e=c.entries.find(e=>e.id===b.dataset.entry);modal='entry';draft={...e,entryNotes:e.notes};error='';render()});
$('#auth-form')?.addEventListener('submit',submitAuth);
$('#entry-form')?.addEventListener('submit',submitEntry);
$('#legacy-file')?.addEventListener('change',e=>{const file=e.target.files[0];if(file)importLegacy(async()=>JSON.parse(await file.text()));});
}
async function submitEntry(e){e.preventDefault();if(busy)return;busy=true;error='';render();try{if(modal==='client')await api('clients/'+draft.clientId,'PATCH',draft);else if(modal==='entry')await api('entries/'+draft.id,'PATCH',{date:draft.date,notes:draft.entryNotes});else if(draft.clientId)await api('clients/'+draft.clientId+'/entries','POST',{date:draft.date,notes:draft.entryNotes});else{if(!draft.newClient)throw{error:'required'};const b=await api('clients','POST',{...draft,entry:{date:draft.date,notes:draft.entryNotes}});active=b.id;}const changed=modal!=='add';modal=null;await load();notify(changed?'updated':'saved');}catch(e){error=e.error||'serverError';if(e.client)duplicate=e.client;}finally{busy=false;render();}}
async function action(a){
if(busy&&a!=='language')return;
if(['auth-login','auth-signup','auth-recover'].includes(a)){
  authMode=a.slice(5);authNotice='';error='';render();return;
}
if(a==='refresh'){await load();render();return;}
if(a==='migration'){if(!user||busy)return;modal='migration';error='';importResult='';render();return;}
if(a==='export-local'){exportLegacy();return;}
if(a==='import-local'){return importLegacy(readRecords);}
if(a==='delete-client'){
  if(busy||!active||!window.confirm(t('confirmDelete')))return;
  busy=true;
  try{await api('clients/'+active,'DELETE');active=null;await load();notify('deleted')}
  catch(e){syncError=e.error||'serverError'}
  finally{busy=false;render()}
  return;
}
if(a==='language')return setLanguage();if(a==='home'){active=null;render()}if(a==='add')startAdd();if(a==='add-existing')startAdd(clients.find(c=>c.id===active));if(a==='close'){if(busy)return;modal=null;error='';duplicate=null;render()}if(a==='new-client'){draft.newClient=true;draft.clientId='';suggest=false;render()}if(a==='unselect'){draft.clientId='';draft.newClient=false;suggest=true;render()}if(a==='edit-client'){const c=clients.find(c=>c.id===active);draft={...c,clientId:c.id};modal='client';error='';render()}if(a==='clear-search'){query='';render()}if(a==='clear-filter'){filter='all';render()}if(a==='logout'){if(busy)return;busy=true;try{await api('logout','POST');resetAccount()}catch(e){syncError=e.error||'network'}finally{busy=false;render()}return;}if(a==='calendar'){modal='calendar';render()}if(a==='apply-calendar'){active=null;filter='day';filterDate=calendarDate;modal=null;render()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&!busy)action('close');if(e.key==='Tab'&&modal){const items=[...document.querySelectorAll('.modal button:not([disabled]),.modal input:not([readonly]),.modal textarea:not([readonly]),.modal select')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0]?.focus()}}});
onSignOut(resetAccount);
async function refreshIfIdle(){
  if(!user||modal||busy||document.hidden)return;
  await load();
  if(user&&!modal&&!busy)render();
}
window.addEventListener('focus',refreshIfIdle);
document.addEventListener('visibilitychange',refreshIfIdle);
setInterval(refreshIfIdle,15000);
busy=true;render();
try{await initializeAuth();}
catch(e){error=e.error||'network'}
finally{busy=false;render()}

</script></body></html>
